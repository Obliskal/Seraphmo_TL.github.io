<html>
    <head>
        <img src="Logo.png" style="max-width: 80%; height: auto;" class="center"/>
    <style>
h1, p {
  text-align: center;
}

/* ads popup */
#ad3-popup {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1000;
    border: none;
    padding: 0;
    pointer-events: none;
}
        
#ad3-popup img {
    display: block;
    width: auto;
    max-width: 320px;
    height: auto;
    margin: 0;
}
#haunted-bg {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-image: url("Ad3.png");
    background-size: cover;
    background-position: center;
    opacity: 0.15; 
    pointer-events: none;
    z-index: -1; 
}
</style>
<link rel="stylesheet" href="style.css"/>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Dress-Up Game</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
  <script src="sketch.js"></script>
</head>
    <body>
        <h1></h1>
            <p>Stay a while and play! <a href="OnceUponaTime.html">It's just like when we were kids.</a></p>
            <a href="Game2.html"><img src="Ad1.png" style="float: right; max-width: 45%; height: auto;"/></a>

    <!-- Pop up ad -->
    <div id="ad3-popup">
    <img src="Ad3.png" alt="Ad"/>
    </div>

    <div id="haunted-bg"></div>

    <script>
        let ad3IsOpen = false;
        
        function showAd3Popup() {
            const popup = document.getElementById("ad3-popup");
            const canvas = document.querySelector("canvas");
            
        if (canvas) {
            const rect = canvas.getBoundingClientRect();
            popup.style.left = (rect.left + window.scrollX + rect.width / 2) + "px";
            popup.style.top = (rect.top + window.scrollY + rect.height / 2) + "px";
        } else {
            popup.style.left = "50%";
            popup.style.top = "50%";
        }
            
        popup.style.display = "block";

        setTimeout(function() {
            ad3IsOpen = true;
            if (canvas) {
            canvas.addEventListener("mousedown", closeAd3OnGameClick, { once: true });
          }
        }, 150);
      }
    
        function closeAd3OnGameClick() {
            if (!ad3IsOpen) return;
            ad3IsOpen = false;

        document.getElementById("ad3-popup").style.display = "none";

        setTimeout(function() {
            document.getElementById("haunted-bg").style.display = "block";
        }, 5000);
    }    
    </script>    
    </body>
</html>
